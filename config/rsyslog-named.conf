# =============================================================================
# rsyslog configuration — BIND 9 audit log forwarding
# Oracle Linux 8
# =============================================================================
#
# Install path: /etc/rsyslog.d/named.conf
# Owner: root:root   Mode: 0644
#
# named writes structured event records to syslog facility local5. The category
# routing in /etc/named.conf sends the audit-relevant categories there:
#
#   xfer-in, xfer-out, notify     — zone transfers + NOTIFY
#   update, update-security       — dynamic updates (and failed updates)
#   security                      — refused queries, ACL denials
#   dnssec                        — DNSSEC signing / validation failures
#   query-errors                  — FORMERR / SERVFAIL we emit
#
# After installation:
#   systemctl restart rsyslog
#   logger -p local5.info "rsyslog-named test"
# =============================================================================

# ---- Plain UDP — development / lab only; NOT approved for CUI -----------
# local5.*   @siem.example.mil:514

# ---- TLS — required for classified / CUI networks ------------------------
local5.*   @@(o)siem.example.mil:6514            # <<CHANGE ME>>

# Notes
#   - @@(o) selects TLS (omfwd with stream driver).
#   - Ensure the SIEM CA chain is trusted by this host:
#       * Add CA to /etc/pki/ca-trust/source/anchors/ then `update-ca-trust`, OR
#       * Set $DefaultNetstreamDriverCAFile in /etc/rsyslog.conf explicitly.
#   - Confirm /etc/rsyslog.conf contains $DefaultNetstreamDriver gtls and
#     $ActionSendStreamDriverAuthMode x509/name (or anon for dev only).
