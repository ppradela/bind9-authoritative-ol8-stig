################################################################################
# /etc/named/zones-secondary.conf — secondary zone declarations
#
# Install: install -o root -g named -m 0640 zones-secondary.conf \
#                  /etc/named/zones-secondary.conf
#
# One stanza per zone for which this host is a secondary. The zone list must be
# identical across all secondaries to keep the served NS RRset consistent.
#
# 'primaries' must include the unicast IP of every primary that may NOTIFY us
# (in a hidden-primary setup, normally exactly one) and must reference the
# matching TSIG key declared in /etc/named/keys/tsig.key.
################################################################################


# ------------------------------------------------------------------------------
# Forward zone — example.com
#
# 'file' lives under /var/named/slaves/ so that named (UID named) can write
# the received zone file on AXFR/IXFR. The directory is owned named:named 0750.
# ------------------------------------------------------------------------------

zone "example.com" IN {
    type secondary;
    file "slaves/db.example.com";
    primaries { 192.0.2.10 key "zone-transfer-key"; };   # primary IP — REPLACE
    allow-transfer { none; };
    masterfile-format text;
};


# ------------------------------------------------------------------------------
# Reverse zone — 192.0.2.0/24 → 2.0.192.in-addr.arpa
# ------------------------------------------------------------------------------

zone "2.0.192.in-addr.arpa" IN {
    type secondary;
    file "slaves/db.192.0.2";
    primaries { 192.0.2.10 key "zone-transfer-key"; };
    allow-transfer { none; };
    masterfile-format text;
};


# ------------------------------------------------------------------------------
# Additional zones — copy and adapt as above. Keep this list IDENTICAL across
# every secondary so the NS RRset returned to clients is consistent.
# ------------------------------------------------------------------------------
