################################################################################
# /etc/named.conf — BIND 9.16 Secondary Authoritative Server
#
# Platform:    Oracle Linux 8 (systemd 239, SELinux enforcing)
# Maintainer:  <your-org-security-team>
#
# Design
#   1. Authoritative-only — recursion fully disabled; serves only zones for
#      which this host is the configured secondary.
#   2. Pulls zones from the primary via TSIG-protected AXFR / IXFR. The same
#      TSIG key (hmac-sha384) configured on the primary is required here.
#   3. Receives NOTIFY messages from the primary to trigger fast re-transfer;
#      otherwise falls back to SOA refresh/retry timers.
#   4. SOA timers tuned for federated / austere operation — relatively short
#      refresh (hours) but very long expire (days to months), so the
#      secondary stays usable during extended disconnection from the primary.
#   5. Outbound transfer requests, queries, and NOTIFY traffic all sourced
#      from a single unicast IP — no anycast on the source path.
#   6. No forwarders; this server never forwards queries for other operators'
#      zones — it answers only zones it is authoritative for.
#
# Standards
#   RFC 1034, 1035, 1123, 2181 (base DNS)
#   RFC 2782 (SRV), RFC 6891 (EDNS(0)), RFC 7766 (DNS over TCP)
#   RFC 5936 (AXFR), RFC 8945 (TSIG)
#
# Files referenced
#   /etc/named/acl.conf              — ACL definitions (trusted_query, primary)
#   /etc/named/keys/tsig.key         — TSIG keys, mode 0640 root:named
#   /etc/named/zones-secondary.conf  — zone declarations (one stanza per zone)
#   /var/named/slaves/               — secondary zone files written by named
################################################################################


# ==============================================================================
# ACL INCLUDES
# ==============================================================================

include "/etc/named/acl.conf";
include "/etc/named/keys/tsig.key";


# ==============================================================================
# SERVER STANZA — bind the TSIG key to traffic going to the primary
# ==============================================================================
#
# Tells named: every packet sent to the primary's address must be signed with
# the named TSIG key. Required so the *outbound* AXFR/IXFR/NOTIFY requests this
# secondary makes carry a valid TSIG.
#
# REPLACE 192.0.2.10 with the primary's unicast address.

server 192.0.2.10 {
    keys { "zone-transfer-key"; };
};


# ==============================================================================
# OPTIONS
# ==============================================================================

options {

    # ---- Working directories ------------------------------------------------
    directory       "/var/named";
    pid-file        "/run/named/named.pid";
    dump-file       "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";
    recursing-file  "/var/named/data/named.recursing";
    secroots-file   "/var/named/data/named.secroots";
    managed-keys-directory "/var/named/dynamic";

    # ---- Listener -----------------------------------------------------------
    # Bind only to the unicast service address — never use 'any' in production.
    # For non-anycasted zones the response source IP must equal the query
    # destination IP — this is naturally satisfied when the host binds to a
    # single service address (no source selection ambiguity).
    # REPLACE 192.0.2.20 with this host's actual unicast service address.
    listen-on port 53 { 127.0.0.1; 192.0.2.20; };
    listen-on-v6 port 53 { ::1; };

    # ---- Query access -------------------------------------------------------
    # Secondaries are the public-facing answer surface for the delegated zone.
    # 'any' is appropriate here unless tighter ACLs are required by policy.
    # Tighten to a 'trusted_query' ACL if this secondary serves only internal
    # clients.
    allow-query { any; };
    allow-query-cache { none; };

    # ---- Recursion disabled — authoritative ONLY ----------------------------
    recursion no;
    allow-recursion { none; };
    # 'fetch-glue', 'additional-from-cache', and 'additional-from-auth' were
    # removed in BIND 9.13+. With recursion=no the daemon already refuses to
    # fetch glue or synthesise additional data from a cache.

    dnssec-validation no;

    # ---- Inbound transfer policy --------------------------------------------
    # Only the primary, authenticated by TSIG, may send AXFR/IXFR/NOTIFY to us.
    # 'primary_peers' is defined in /etc/named/acl.conf and lists each primary
    # IP combined with the matching TSIG key clause.
    allow-notify   { primary_peers; };
    allow-transfer { none; };

    # ---- No forwarders ------------------------------------------------------
    # This secondary does not forward queries for zones hosted elsewhere.
    forwarders { };
    forward only;

    # ---- Outbound source addressing — unicast only --------------------------
    # AXFR/IXFR requests to the primary and all other outbound DNS exchanges
    # originate from this unicast address.
    # REPLACE 192.0.2.20 with this host's actual unicast outbound address.
    query-source       address 192.0.2.20;
    transfer-source    192.0.2.20;
    notify-source      192.0.2.20;
    use-v4-udp-ports   { range 32768 60999; };
    # IPv6 outbound transfer not used — daemon listens only on ::1 for local
    # IPv6. 'transfer-source-v6 none;' is invalid syntax in BIND 9.16.

    # ---- Response size & EDNS(0) -------------------------------------------
    edns-udp-size 1232;
    max-udp-size  1232;
    minimal-responses yes;

    # ---- Identity / disclosure ---------------------------------------------
    version  "Not disclosed";
    hostname "Not disclosed";
    server-id none;

    # ---- Algorithm policy --------------------------------------------------
    disable-algorithms "." {
        RSAMD5; DSA; NSEC3DSA; RSASHA1; NSEC3RSASHA1;
    };

    # ---- Transport ---------------------------------------------------------
    tcp-clients 1024;
    tcp-listen-queue 32;

    # ---- Rate limiting -----------------------------------------------------
    rate-limit {
        responses-per-second 20;
        errors-per-second    5;
        nxdomains-per-second 5;
        window               5;
        slip                 2;
        exempt-clients       { primary_peers; };
    };
};


# ==============================================================================
# CONTROL CHANNEL
# ==============================================================================

include "/etc/rndc.key";

controls {
    inet 127.0.0.1 port 953
        allow { 127.0.0.1; }
        keys  { "rndc-key"; };
};


# ==============================================================================
# LOGGING — same channel set as the primary; SIEM forwarding via local5
# ==============================================================================

logging {

    channel "xfer_file" {
        file "/var/log/named/xfer.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel "security_file" {
        file "/var/log/named/security.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel "dnssec_file" {
        file "/var/log/named/dnssec.log" versions 10 size 50m;
        severity dynamic;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel "queryerror_file" {
        file "/var/log/named/query-errors.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel "default_file" {
        file "/var/log/named/named.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel "syslog_local5" {
        syslog local5;
        severity info;
        print-category yes;
        print-severity yes;
    };

    category default          { default_file; syslog_local5; };
    category general          { default_file; syslog_local5; };
    category config           { default_file; syslog_local5; };
    category security         { security_file; syslog_local5; };
    category xfer-in          { xfer_file; syslog_local5; };
    category xfer-out         { xfer_file; syslog_local5; };
    category notify           { xfer_file; syslog_local5; };
    category update           { security_file; syslog_local5; };
    category update-security  { security_file; syslog_local5; };
    category dnssec           { dnssec_file; syslog_local5; };
    category client           { security_file; };
    category query-errors     { queryerror_file; syslog_local5; };
    category lame-servers     { null; };
};


# ==============================================================================
# ZONES
# ==============================================================================

# Standard EL/OL local zones.
zone "." IN {
    type hint;
    file "named.ca";
};

zone "localhost.localdomain" IN {
    type primary;
    file "named.localhost";
    allow-update   { none; };
    allow-transfer { none; };
};

zone "localhost" IN {
    type primary;
    file "named.localhost";
    allow-update   { none; };
    allow-transfer { none; };
};

zone "1.0.0.127.in-addr.arpa" IN {
    type primary;
    file "named.loopback";
    allow-update   { none; };
    allow-transfer { none; };
};

zone "0.in-addr.arpa" IN {
    type primary;
    file "named.empty";
    allow-update   { none; };
    allow-transfer { none; };
};

# Site-authoritative zones (type secondary) — declared in a separate file.
include "/etc/named/zones-secondary.conf";


# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
