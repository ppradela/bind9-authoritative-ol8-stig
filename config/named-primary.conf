################################################################################
# /etc/named.conf — BIND 9.16 Primary Authoritative Server
#
# Platform:    Oracle Linux 8 (systemd 239, SELinux enforcing)
# Maintainer:  <your-org-security-team>
#
# Design
#   1. Authoritative-only — recursion fully disabled; no cache responses served.
#   2. Hidden-primary posture — answers DNS queries only from a strict
#      operator-defined ACL (typically a management subnet). The secondaries
#      pull zones via TSIG-protected AXFR/IXFR; recursive resolvers should
#      query the secondaries, not this host.
#   3. Outgoing zone transfers protected by TSIG (hmac-sha384 mandatory).
#      NOTIFY messages sent to secondaries on every zone change for fast
#      re-transfer.
#   4. Outbound queries, NOTIFY, and transfers all sourced from a single
#      unicast IP address — no anycast on the source path.
#   5. DNSSEC signing via the modern dnssec-policy framework (BIND 9.16+):
#      automated KSK/ZSK rollover, re-signing on zone change, signature-expiry
#      and key-expiry triggers. Algorithms restricted to RSASHA256, RSASHA512,
#      ECDSAP256SHA256, ECDSAP384SHA384.
#   6. Comprehensive logging: zone transfers (in/out), NOTIFY, dynamic updates,
#      query errors, DNSSEC validation/signing failures, security events.
#
# Standards
#   RFC 1034, 1035, 1123, 2181 (base DNS)
#   RFC 2782 (SRV), RFC 6891 (EDNS(0)), RFC 7766 (DNS over TCP)
#   RFC 5936 (AXFR), RFC 8945 (TSIG)
#
# Files referenced
#   /etc/named/acl.conf            — ACL definitions (trusted_query, xfer peers)
#   /etc/named/keys/tsig.key       — TSIG keys, mode 0640 root:named
#   /etc/named/zones-primary.conf  — zone declarations (one stanza per zone)
#   /var/named/                    — zone files (PRIMARY zone source-of-truth)
#   /var/named/keys/               — DNSSEC key material (KSK private offline,
#                                    ZSK on-host for automated signing)
################################################################################


# ==============================================================================
# ACL INCLUDES — keep ACL definitions and TSIG keys in separate, mode-0640 files
# ==============================================================================

include "/etc/named/acl.conf";
include "/etc/named/keys/tsig.key";


# ==============================================================================
# OPTIONS
# ==============================================================================

options {

    # ---- Working directories ------------------------------------------------
    directory       "/var/named";
    pid-file        "/run/named/named.pid";
    dump-file       "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";
    recursing-file  "/var/named/data/named.recursing";
    secroots-file   "/var/named/data/named.secroots";
    managed-keys-directory "/var/named/dynamic";

    # ---- Listener -----------------------------------------------------------
    # Bind only to the unicast service address — never use 'any' in production.
    # REPLACE 192.0.2.10 with this host's actual unicast service address.
    listen-on port 53 { 127.0.0.1; 192.0.2.10; };
    listen-on-v6 port 53 { ::1; };

    # ---- Query access — hidden primary posture ------------------------------
    # Only the operator-defined 'trusted_query' ACL receives answers for normal
    # queries. Set this to a tight management network — secondaries should
    # transfer zones, not query the primary for production traffic.
    allow-query { trusted_query; };

    # No cache is served (authoritative only). 'none' is defence-in-depth even
    # though recursion is disabled.
    allow-query-cache { none; };

    # ---- Recursion disabled — authoritative ONLY ----------------------------
    recursion no;
    allow-recursion { none; };
    # Note: 'fetch-glue', 'additional-from-cache', and 'additional-from-auth'
    # were removed in BIND 9.13+ (named-checkconf: "option … no longer
    # exists"). With recursion=no the daemon already refuses to fetch glue or
    # synthesise additional data from a cache, so no replacement is needed.

    # Empty the built-in trust-anchor / DNSSEC validator state — this is an
    # authoritative server, not a validator.
    dnssec-validation no;

    # ---- Zone transfers — TSIG-only, hmac-sha384 ----------------------------
    # The 'transfer_peers' ACL is defined in /etc/named/acl.conf and must list
    # both the IPs of every authorised secondary AND a 'key' clause naming the
    # TSIG key they use. Anything not matching is refused.
    allow-transfer { transfer_peers; };

    # Send NOTIFY to all configured secondaries (zone-level masters list).
    notify yes;
    notify-source 192.0.2.10;            # REPLACE with this host's unicast IP

    # ---- Outbound source addressing — unicast only --------------------------
    # All outbound DNS, NOTIFY, and transfer traffic is sourced from this
    # unicast address. No anycast on the outbound path; supports auditability
    # and firewall ingress filters on peer secondaries.
    query-source       address 192.0.2.10;       # REPLACE
    transfer-source    192.0.2.10;               # REPLACE
    transfer-source-v6 none;
    use-v4-udp-ports   { range 32768 60999; };

    # ---- Dynamic updates ----------------------------------------------------
    # Disabled by default — STIG posture is statically-configured zones.
    # If a specific zone needs dynamic updates (e.g., RFC 2136 from a DHCP
    # server), enable per-zone via 'update-policy' in zones-primary.conf,
    # never globally.
    allow-update { none; };

    # ---- Response size & EDNS(0) -------------------------------------------
    # 1232 = DNS Flag Day 2020 recommendation; fits within minimum IPv6 MTU
    # (1280 bytes per RFC 8200) after IPv6 + UDP headers. Supports
    # fragmentation-safe behaviour for larger DNSSEC responses.
    edns-udp-size 1232;
    max-udp-size  1232;

    # Strip authority/additional sections where possible. Required to keep the
    # delegation referral (NS set + one glue A) within the 512-octet UDP limit
    # mandated for non-EDNS clients.
    minimal-responses yes;

    # ---- Identity / disclosure ---------------------------------------------
    version  "Not disclosed";
    hostname "Not disclosed";
    server-id none;

    # ---- Algorithm policy --------------------------------------------------
    # Refuse to validate or load zones signed with weak algorithms. Restricts
    # DNSSEC algorithm acceptance to the four approved here (RSASHA256,
    # RSASHA512, ECDSAP256SHA256, ECDSAP384SHA384).
    disable-algorithms "." {
        RSAMD5; DSA; NSEC3DSA; RSASHA1; NSEC3RSASHA1;
    };

    # ---- Transport ----------------------------------------------------------
    # DNS over TCP (RFC 7766) is on by default in BIND 9.16; clamp the
    # concurrent TCP client count to a sane upper bound.
    tcp-clients 1024;
    tcp-listen-queue 32;

    # ---- Rate limiting -----------------------------------------------------
    # Response Rate Limiting — mitigates DNS amplification reflection abuse.
    # Tune to expected legitimate query rate per source /24.
    rate-limit {
        responses-per-second 20;
        errors-per-second    5;
        nxdomains-per-second 5;
        window               5;
        slip                 2;
        exempt-clients       { transfer_peers; };
    };
};


# ==============================================================================
# DNSSEC POLICY — automated KSK/ZSK management (BIND 9.16+)
# ==============================================================================
#
# Algorithms restricted to STIG-approved set:
#   8  = RSASHA256       (acceptable)
#   10 = RSASHA512       (acceptable)
#   13 = ECDSAP256SHA256 (default below — recommended)
#   14 = ECDSAP384SHA384 (acceptable, larger signatures)
#
# Key lifetimes:
#   KSK ~5 years   (private may be kept offline; only public part on-host)
#   ZSK ~1 year    (~1 month overlap during rollover)
#
# Re-signing is triggered automatically by named on:
#   - any zone change (AXFR-in, dynamic update, file reload)
#   - signature expiry approaching
#   - key activation / retirement boundary
#
# Per-zone selection: set 'dnssec-policy "stig-default";' in the zone stanza.

dnssec-policy "stig-default" {
    keys {
        ksk lifetime P5Y  algorithm ecdsap256sha256;
        zsk lifetime P1Y  algorithm ecdsap256sha256;
    };
    dnskey-ttl          PT1H;
    publish-safety      PT1H;
    retire-safety       PT1H;
    purge-keys          P90D;
    signatures-refresh  P5D;
    signatures-validity P14D;
    signatures-validity-dnskey P14D;
    max-zone-ttl        P1D;
    zone-propagation-delay      PT1H;
    parent-propagation-delay    PT1H;
    parent-ds-ttl       PT1H;
};

# RSASHA256 alternative — use only when the parent registry does not yet
# accept algorithm 13. Reference for zone stanzas: dnssec-policy "stig-rsa";
dnssec-policy "stig-rsa" {
    keys {
        ksk key-directory lifetime P5Y algorithm rsasha256 2048;
        zsk key-directory lifetime P1Y algorithm rsasha256 1280;
    };
    dnskey-ttl          PT1H;
    signatures-refresh  P5D;
    signatures-validity P14D;
    signatures-validity-dnskey P14D;
    max-zone-ttl        P1D;
};


# ==============================================================================
# CONTROL CHANNEL — restricted to loopback, key-authenticated
# ==============================================================================
#
# rndc administrative commands. /etc/rndc.key is created by:
#   rndc-confgen -a -k rndc-key -c /etc/rndc.key -A hmac-sha256 -b 256
# and chmod 0640 root:named, with the matching key included below.

include "/etc/rndc.key";

controls {
    inet 127.0.0.1 port 953
        allow { 127.0.0.1; }
        keys  { "rndc-key"; };
};


# ==============================================================================
# LOGGING — file channels with size-based rotation; syslog channel for SIEM
# ==============================================================================
#
# /var/log/named/ must exist with mode 0750, owner named:named.
# rsyslog forwards local5.* to the SIEM (see config/rsyslog-named.conf).

logging {

    # File channel — DNSSEC signing/validation events
    channel "dnssec_file" {
        file "/var/log/named/dnssec.log" versions 10 size 50m;
        severity dynamic;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    # File channel — zone transfers in/out, NOTIFY, IXFR
    channel "xfer_file" {
        file "/var/log/named/xfer.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    # File channel — dynamic update events
    channel "update_file" {
        file "/var/log/named/update.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    # File channel — security / access denials, refused queries
    channel "security_file" {
        file "/var/log/named/security.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    # File channel — query errors, FORMERR, SERVFAIL we emit
    channel "queryerror_file" {
        file "/var/log/named/query-errors.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    # File channel — general / default
    channel "default_file" {
        file "/var/log/named/named.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    # Syslog channel — facility local5, forwarded by rsyslog to SIEM
    channel "syslog_local5" {
        syslog local5;
        severity info;
        print-category yes;
        print-severity yes;
    };

    # Category routing
    category default        { default_file; syslog_local5; };
    category general        { default_file; syslog_local5; };
    category config         { default_file; syslog_local5; };
    category security       { security_file; syslog_local5; };
    category xfer-in        { xfer_file; syslog_local5; };
    category xfer-out       { xfer_file; syslog_local5; };
    category notify         { xfer_file; syslog_local5; };
    category update         { update_file; syslog_local5; };
    category update-security { update_file; security_file; syslog_local5; };
    category dnssec         { dnssec_file; syslog_local5; };
    category dispatch       { default_file; };
    category network        { default_file; };
    category client         { security_file; };
    category resolver       { default_file; };
    category query-errors   { queryerror_file; syslog_local5; };
    category rpz            { security_file; syslog_local5; };
    category cname          { default_file; };
    category lame-servers   { null; };
};


# ==============================================================================
# ZONES
# ==============================================================================

# Standard EL/OL local zones (loopback, localhost) — shipped by bind-package.
zone "." IN {
    type hint;
    file "named.ca";
};

zone "localhost.localdomain" IN {
    type primary;
    file "named.localhost";
    allow-update { none; };
    allow-transfer { none; };
};

zone "localhost" IN {
    type primary;
    file "named.localhost";
    allow-update { none; };
    allow-transfer { none; };
};

zone "1.0.0.127.in-addr.arpa" IN {
    type primary;
    file "named.loopback";
    allow-update { none; };
    allow-transfer { none; };
};

zone "0.in-addr.arpa" IN {
    type primary;
    file "named.empty";
    allow-update { none; };
    allow-transfer { none; };
};

# Site-authoritative zones — declared in a separate file for clarity.
include "/etc/named/zones-primary.conf";


# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
