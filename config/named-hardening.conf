# ==============================================================================
# /etc/systemd/system/named.service.d/hardening.conf
# Hardening drop-in for BIND 9.16 (`named.service`) on Oracle Linux 8
#
# systemd version: 239 (shipped across all OL8 point releases)
#
# Stock unit (from package `bind`) already sets — do NOT repeat;
# list-type keys accumulate
# ------------------------------------------------------------------
#   User=named   Group=named
#   PIDFile=/run/named/named.pid
#   RuntimeDirectory=named            → creates /run/named (mode 0750)
#   RuntimeDirectoryMode=0750
#   ExecStart=/usr/sbin/named -u named -c /etc/named.conf
#
# IMPORTANT NOTES FOR OL8 (systemd 239 + SELinux enforcing):
#
#   The following directives implicitly force NoNewPrivileges=true at kernel
#   level, which blocks the SELinux domain transition init_t → named_t
#   (AVC: denied { nnp_transition }). They are intentionally excluded:
#
#     SystemCallFilter=, RestrictNamespaces=, LockPersonality=,
#     RestrictRealtime=, ProtectKernelTunables=, ProtectKernelModules=,
#     MemoryDenyWriteExecute=, PrivateDevices=
#
#   Additional systemd 240+ / 245+ / 253+ directives that are NOT available
#   on OL8 (systemd 239) and must not be used:
#
#     ProtectHostname=, ProtectClock=, RestrictSUIDSGID=, ProtectKernelLogs=
#
#   Other constraints
#
#   - ProtectSystem=strict breaks SELinux on OL8 (prevents exec under
#     /usr/sbin/). ProtectSystem=full is the safe maximum.
#
#   - ReadWritePaths= must reference paths that exist at service start;
#     a missing path causes 'Failed at step NAMESPACE' with no indication
#     of which path is the offender.
#
#   - RuntimeDirectory= is already set by the stock unit — do not repeat
#     here (list-type keys accumulate).
# ==============================================================================

[Unit]

# ── Wait for the network to actually be ONLINE before starting named ─────────
# The stock unit declares only 'After=network.target', which signals that the
# network stack is initialised — NOT that interfaces have their IPs assigned.
# At boot, named tries to bind to the unicast IPs in 'listen-on' and
# 'query-source address' before NetworkManager has finished configuring the
# interface, and exits with:
#     could not get query source dispatcher (<IP>#0)
#     loading configuration: address not available
# network-online.target gates start until NetworkManager-wait-online reports
# that every configured interface either has an IP or has timed out.
Wants=network-online.target
After=network-online.target


[Service]

# ── Prevent core dumps ───────────────────────────────────────────────────────
LimitCORE=0

# ── Tighten capabilities ─────────────────────────────────────────────────────
# CapabilityBoundingSet is the UPPER BOUND on capabilities, applied even
# during the root startup phase. The EL stock unit does NOT set User=named —
# named starts as root, then drops itself via `-u named`. During the root
# phase the daemon needs:
#
#   CAP_NET_BIND_SERVICE  — bind() to port 53
#   CAP_SETUID, CAP_SETGID — drop to user 'named' via setuid()/setgid()
#   CAP_DAC_READ_SEARCH    — read /var/named/db.* (owned named:named, mode
#                            0640) and /etc/named.conf from root before the
#                            setuid() call; without this even root gets
#                            EACCES, and ExecStartPre (named-checkconf -z)
#                            fails with "permission denied" on the zone file
#                            despite Unix mode being correct for named.
#
# After setuid(named), only the ambient set survives — CAP_NET_BIND_SERVICE.
# The daemon runs as user 'named' with no broader access than that one
# capability plus normal user permissions.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_DAC_READ_SEARCH
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE

# ── Filesystem isolation ─────────────────────────────────────────────────────
PrivateTmp=true
ProtectHome=true
ProtectControlGroups=true

# Read-only system view inside the service namespace. Stock unit already sets
# ProtectSystem=full; this is idempotent but explicit for auditability.
ProtectSystem=full

# Paths named must be able to write to from inside the namespace:
#   /var/named           — zone files, slave zones, signed zones, journals
#   /var/log/named       — log files written by named (dnssec.log, xfer.log…)
# /run/named is already provided via RuntimeDirectory= in the stock unit.
ReadWritePaths=/var/named /var/log/named

# ── File creation mask ───────────────────────────────────────────────────────
UMask=0027

# ── IPC cleanup on exit ──────────────────────────────────────────────────────
RemoveIPC=yes

# ── Syslog identity ──────────────────────────────────────────────────────────
SyslogIdentifier=named
SyslogFacility=local5

# ── Pre-start configuration check ────────────────────────────────────────────
# Catch obvious mistakes (missing config or zone files) with a clear message
# instead of the cryptic 'Failed at step EXEC' from the kernel.
ExecStartPre=/bin/sh -c 'test -f /etc/named.conf || { echo "FATAL: /etc/named.conf missing"; exit 1; }'
ExecStartPre=/usr/sbin/named-checkconf -z /etc/named.conf
