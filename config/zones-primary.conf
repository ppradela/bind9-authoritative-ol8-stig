################################################################################
# /etc/named/zones-primary.conf — primary zone declarations
#
# Install: install -o root -g named -m 0640 zones-primary.conf \
#                  /etc/named/zones-primary.conf
#
# One stanza per authoritative zone. Replace <<DOMAIN>> and <<REVERSE_ZONE>>
# with site-specific values. A distinct zone file is created per signed zone.
################################################################################


# ------------------------------------------------------------------------------
# Forward zone — example.nation (signed)
#
# Notes
#   - 'dnssec-policy' triggers automated KSK/ZSK management and re-signing
#     on zone modification, signature expiry, and key boundary events.
#   - 'inline-signing yes' keeps the unsigned zone file on disk and lets named
#     maintain a signed copy in memory + journal — required when a zone is
#     edited by hand and re-loaded.
#   - 'masterfile-format text' keeps the file human-readable for audit.
# ------------------------------------------------------------------------------

zone "example.nation" IN {
    type primary;
    # Path is relative to options { directory "/var/named"; }. /var/named is
    # shipped by the bind9.16 package as mode 1770 root:named so the 'named'
    # group has write access — inline-signing can create the .jnl and
    # .signed files next to the master file here. SELinux: named_zone_t,
    # writable by named_t under the OL8 bind9.16 policy module.
    file "db.example.nation";
    masterfile-format text;
    allow-update   { none; };                  # static zone
    allow-transfer { transfer_peers; };
    notify         yes;
    also-notify    { 192.0.2.20; 192.0.2.21; };
    dnssec-policy  "stig-default";
    inline-signing yes;
};


# ------------------------------------------------------------------------------
# Reverse zone — 2.0.192.in-addr.arpa  (192.0.2.0/24, 8-bit boundary)
#
# Delegation of IPv4 reverse zones on full 8-bit boundaries is supported by
# encoding each /8, /16, or /24 boundary as a separate in-addr.arpa zone.
# This stanza covers a full /24.
# ------------------------------------------------------------------------------

zone "2.0.192.in-addr.arpa" IN {
    type primary;
    file "db.192.0.2";                      # see note on path above
    masterfile-format text;
    allow-update   { none; };
    allow-transfer { transfer_peers; };
    notify         yes;
    also-notify    { 192.0.2.20; 192.0.2.21; };
    dnssec-policy  "stig-default";
    inline-signing yes;
};


# ------------------------------------------------------------------------------
# Additional zones — copy and adapt the stanza above. One file per zone.
# ------------------------------------------------------------------------------
