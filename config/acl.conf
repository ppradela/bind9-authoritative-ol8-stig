################################################################################
# /etc/named/acl.conf — ACL definitions shared between primary and secondary
#
# Install:  install -o root -g named -m 0640 acl.conf /etc/named/acl.conf
#
# Referenced from /etc/named.conf via:
#     include "/etc/named/acl.conf";
#
# Edit every <<...>> placeholder before deployment.
################################################################################


# ==============================================================================
# trusted_query — clients allowed to ask the PRIMARY normal queries.
#
# On a hidden-primary host this should be a TIGHT management subnet — usually
# just the operator network and the secondaries' service IPs. Public-facing
# query traffic goes to the secondaries, not here.
# ==============================================================================

acl "trusted_query" {
    127.0.0.0/8;
    ::1/128;

    # Management subnet (operators / monitoring) — REPLACE
    <<MGMT_SUBNET>>/24;

    # Secondary service IPs — REPLACE (allow secondaries to query primary for
    # consistency checks, dig, etc., not for production query traffic).
    192.0.2.20/32;
    192.0.2.21/32;
};


# ==============================================================================
# transfer_peers — secondaries authorised to pull zones from the PRIMARY.
#
# Listing the IP alone is not sufficient — the TSIG key MUST also match.
# The 'key' clause is what enforces authentication; the IP filter narrows the
# attack surface.
# ==============================================================================

acl "transfer_peers" {
    !{ !key "zone-transfer-key"; any; };   # require TSIG signature on transfer
    192.0.2.20/32;                          # secondary-1 — REPLACE
    192.0.2.21/32;                          # secondary-2 — REPLACE
};


# ==============================================================================
# primary_peers — the PRIMARY's IP (used by secondaries to permit NOTIFY).
#
# Required on the SECONDARY only.  Equivalent role to 'transfer_peers' but in
# the opposite direction: which IP is allowed to send us NOTIFY.
# ==============================================================================

acl "primary_peers" {
    !{ !key "zone-transfer-key"; any; };
    192.0.2.10/32;                          # primary unicast IP — REPLACE
};


# ==============================================================================
# END
# ==============================================================================
